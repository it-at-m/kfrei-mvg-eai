name: build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  mvn-build:
    runs-on: ubuntu-latest
    permissions:
      # required to pull repository contents
      contents: read
      # required to push container images to ghcr.io
      packages: write
    
    steps:
      # Generate safe slug values for branch names (Docker-compatible)
      - name: Generate slug variables
        uses: rlespinasse/github-slug-action@0e3299190dac9a700da92a90de4556116ea965ed # v5.7.1
      
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      
      # Install JDK (with Maven cache for faster non-release builds)
      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 25.0.4+7.0.LTS
          distribution: temurin
          cache: maven
      
      # Build application, container image and publish it
      # Tags: branch name
      # - branch name
      # - commit SHA
      - name: Build with Maven (including image build & push)
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B -ntp clean package
          -Pcontainer
          -Dimage.name=ghcr.io/${{ github.repository }}
          -Dimage.tag.primary=${{ env.GITHUB_REF_NAME_SLUG }}
          -Dimage.tag.sha=${{ env.GITHUB_SHA_SHORT }}